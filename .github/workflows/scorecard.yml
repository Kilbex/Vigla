name: Scorecard

# OpenSSF Scorecard scores the repository's supply-chain posture:
# SHA-pinned actions, minimal workflow permissions, branch protection,
# dangerous-workflow patterns, and whether CI actually gates PRs.
#
# Deliberately NOT a required check and deliberately not on
# pull_request: Scorecard reads repository *settings*, which a fork PR
# cannot influence and which change independently of any diff. Making it
# block merges would fail PRs for reasons no contributor can fix.
#
# `publish_results: false` keeps the score out of the public
# api.scorecard.dev dataset — publishing is an owner decision, not a
# side effect of adding the workflow. See docs/operations/github-launch.md.

on:
  branch_protection_rule:
  schedule:
    # Weekly, offset from the daily traffic snapshot at 08:17 UTC.
    - cron: "23 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to read branch-protection and ruleset state.
      contents: read
      # Scorecard reads the Actions API for the Dangerous-Workflow and
      # Token-Permissions checks.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing uploads this repository's score to the public
          # OpenSSF dataset. That is a maintainer decision with no undo,
          # so it stays off until the owner opts in.
          publish_results: false

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

[advisories]
# Ignore list for `cargo audit --deny warnings`. Every entry names the crate,
# the dependent that pulls it in, whether it is compiled for the shipped macOS
# target, and the condition that clears it. "Compiled on macOS" was decided per
# crate with
#
#   cargo tree -i <crate> --target aarch64-apple-darwin --all-features
#
# and cross-checked against `--target all`; a crate that prints nothing for the
# Darwin target but appears for `all` is reached only through a Linux or
# Windows dependency edge. A NEW advisory on any dependency still hard-fails
# CI — this list only tolerates the audited baseline, so delete an entry when
# its trigger fires instead of refreshing it.
ignore = [
    # rsa 0.9.10 — Marvin timing side-channel (vulnerability). No fixed
    # upstream release exists.
    # Dependent: sqlx-mysql <- sqlx-macros-core <- sqlx-macros <- sqlx.
    # Compiled: nowhere. The workspace enables only sqlx's runtime-tokio,
    # sqlite, macros and migrate features, so sqlx-mysql stays an inactive
    # optional dependency and `cargo tree -i rsa --target all --all-features`
    # prints nothing. rsa is in Cargo.lock only because a lockfile records the
    # union of optional dependencies, not the resolved graph.
    # Clear when: sqlx stops vendoring an rsa-backed MySQL auth path, or rsa
    # ships a constant-time implementation.
    "RUSTSEC-2023-0071",

    # quick-xml — unbounded namespace-declaration allocation (0195) and a
    # quadratic duplicate-attribute scan (0194); both are XML denial of
    # service against attacker-supplied documents. Fixed in >=0.41.0, but the
    # dependents below require ^0.37 and ^0.39.2, so no semver-compatible bump
    # exists. Vigla's own parsers read vendor CLI JSON, never XML.
    #   * 0.37.5 <- tauri-winrt-notification <- notify-rust <-
    #     tauri-plugin-notification. Windows WinRT toast payloads; NOT compiled
    #     for aarch64-apple-darwin.
    #   * 0.39.3 <- plist <- tauri-utils / tauri-codegen / tauri-plugin /
    #     tauri. COMPILED on macOS, as both a build and a normal dependency.
    #     Its only input is the application's own Info.plist — emitted by our
    #     build and read back from the signed bundle — so the DoS input is
    #     never third-party.
    # Clear when: tauri's notify-rust and plist trees move to quick-xml 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # gtk-rs GTK3 bindings — unmaintained crates, no vulnerability.
    # Dependent: gtk 0.18.2 <- wry / webkit2gtk / tao / muda / libappindicator
    # <- tauri, i.e. tauri's Linux webview and tray stack.
    # Compiled: no. None of these appears for aarch64-apple-darwin.
    # Clear when: tauri drops its GTK3 transitive dependencies. If Linux ever
    # becomes a shipped target these need real triage, not a renewed ignore.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys

    # glib 0.18.5 — unsound `Iterator`/`DoubleEndedIterator` impls for
    # `VariantStrIter`. Dependent: the same GTK3 stack (gtk, gdk, webkit2gtk,
    # soup3, libappindicator). Compiled: no, Linux only.
    # Clear when: the GTK3 entries above clear.
    "RUSTSEC-2024-0429",

    # proc-macro-error 1.0.4 — unmaintained, no vulnerability.
    # Dependents: glib-macros 0.18.5 and gtk3-macros 0.18.2, both part of the
    # GTK3 stack. Compiled: no, Linux only.
    # Clear when: the GTK3 entries above clear.
    "RUSTSEC-2024-0370",

    # paste 1.0.15 — unmaintained, no vulnerability. The crate is archived as
    # feature-complete and has no successor advisory or patched release.
    # Dependents: specta (every Vigla crate), tokenizers and rav1e <- ravif <-
    # image (both under the optional fastembed embedding backend).
    # Compiled: YES on macOS — this is proc-macro-only code that runs at build
    # time and emits no runtime surface.
    # Clear when: specta and tokenizers move to `pastey` or an inline
    # concat-idents replacement.
    "RUSTSEC-2024-0436",

    # unic-* 0.9.0 — unmaintained, no vulnerability. These are static Unicode
    # identifier tables with no I/O and no unsafe parsing.
    # Dependent (all five): urlpattern 0.3.0 <- tauri-utils <- tauri, used to
    # match Tauri capability URL patterns.
    # Compiled: YES on macOS, as both a build and a normal dependency.
    # Clear when: urlpattern replaces unic-ucd-ident with `unicode-ident`, or
    # tauri-utils drops urlpattern.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
